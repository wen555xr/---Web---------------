<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}网络自动化运维工具{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">🛠️ 网络自动化运维工具</div>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">控制台</a>
      <a href="{{ url_for('devices_page') }}" class="{{ 'active' if request.endpoint == 'devices_page' }}">设备管理</a>
      <a href="{{ url_for('tasks_page') }}" class="{{ 'active' if request.endpoint == 'tasks_page' }}">任务历史</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
